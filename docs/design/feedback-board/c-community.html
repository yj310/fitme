<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 C · 공감 게시판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="shared.js"></script>
<style>
  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 20px; max-width: 1080px; }
  .compose { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .compose .input { font-size: 15px; }
  .compose.collapsed .more { display: none; }
  .compose .row2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .feed-h { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 10px; gap: 8px; flex-wrap: wrap; }
  .feed { display: flex; flex-direction: column; gap: 10px; }
  .post { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; padding: 14px 16px; }
  .vote { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 1px solid var(--line-strong); border-radius: 12px; height: 62px; background: var(--surface); font-weight: 700; }
  .vote small { font-weight: 400; font-size: 10.5px; color: var(--muted); }
  .vote.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .post .t { font-weight: 700; font-size: 15px; }
  .post .b { color: var(--muted); font-size: 13.5px; margin: 2px 0 8px; }
  .post .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .post .reply { margin-top: 10px; background: var(--good-soft); color: var(--ink); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
  .post .reply.doing { background: var(--accent-soft); }
  .post .admin-tools { margin-top: 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding-top: 10px; border-top: 1px dashed var(--line); }
  .side-box { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .side-box h3 { margin: 0; font-size: 14px; }
  .road { display: flex; flex-direction: column; gap: 6px; }
  .road a { display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: inherit; padding: 6px 8px; border-radius: 8px; }
  .road a:hover, .road a.on { background: var(--app-bg); }
  .road .n { font-family: "IBM Plex Mono", monospace; font-weight: 600; }
  .log { display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
  .log .d { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--good); }
  .sort button { border: 0; background: transparent; color: var(--muted); padding: 2px 6px; font-size: 13px; }
  .sort button.on { color: var(--ink); font-weight: 700; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="mock-bar">
  <b>시안 C · 공감 게시판</b><span>참고: Canny · Featurebase · Frill (공개 피드백 + 로드맵 + 해결 소식)</span>
  <span class="sp"></span>
  <span class="seg"><button data-mode="user" class="on">사용자 화면</button><button data-mode="admin">관리자 화면</button></span>
  <a href="index.html">← 시안 목록</a>
</div>
<div class="app">
  <script>document.write(sidebar());</script>
  <main class="main">
    <h1 class="h1">피드백</h1>
    <p class="sub">다른 사람이 먼저 남겼다면 <b>나도 겪었어요</b>를 눌러 주세요. 많이 눌린 것부터 고쳐요.</p>
    <div class="wrap" style="margin-top:14px">
      <div>
        <div class="card compose collapsed" id="compose">
          <input class="input" id="title" placeholder="어떤 점이 불편했나요? 바라는 점도 좋아요">
          <div class="more">
            <textarea class="textarea" placeholder="어떤 화면에서, 무엇을 했을 때 그랬나요?" style="margin-bottom:10px"></textarea>
            <div class="drop" id="drop"><b>사진 끌어다 놓기 · 클릭</b> · 스크린샷은 <span class="kbd">⌘/Ctrl</span>+<span class="kbd">V</span></div>
            <input type="file" accept="image/*" multiple hidden id="file">
            <div class="thumbs" id="picked" style="margin-top:8px"></div>
            <div id="similar" style="margin-top:10px"></div>
          </div>
          <div class="row2 more">
            <span class="seg2"><button class="on">🐞 버그</button><button>💡 제안</button><button>💬 기타</button></span>
            <span style="display:flex;gap:6px"><button class="btn" id="cancel">취소</button><button class="btn primary" id="send">올리기</button></span>
          </div>
        </div>

        <div class="feed-h">
          <span class="seg2" id="stSeg"><button class="on" data-s="open">진행 전·중</button><button data-s="done">해결됨</button><button data-s="all">전체</button></span>
          <span class="sort" id="sort"><button class="on" data-o="votes">공감순</button><button data-o="new">최신순</button></span>
        </div>
        <div class="feed" id="feed"></div>
      </div>

      <aside style="display:flex;flex-direction:column;gap:14px">
        <div class="card side-box">
          <h3>진행 상황</h3>
          <div class="road" id="road"></div>
        </div>
        <div class="card side-box">
          <h3>최근에 고쳤어요</h3>
          <div class="log" id="log"></div>
        </div>
        <div class="card side-box admin-only">
          <h3>관리자</h3>
          <span class="muted" style="font-size:12.5px">새 피드백 <b style="color:var(--warn)">3</b>건 · 이번 주 해결 <b style="color:var(--good)">3</b>건</span>
          <label style="font-size:12.5px"><input type="checkbox" checked> 새 피드백이 오면 메일 받기</label>
        </div>
      </aside>
    </div>
  </main>
</div>

<script>
  let stFilter = "open", order = "votes";
  const voted = new Set([8]);

  function renderFeed() {
    const admin = document.body.classList.contains("admin");
    let list = POSTS.filter((p) => stFilter === "all" || (stFilter === "done" ? p.status === "done" : p.status !== "done"));
    list = list.sort((a, b) => order === "votes" ? b.votes - a.votes : b.id - a.id);
    document.getElementById("feed").innerHTML = list.map((p) => `
      <article class="card post">
        <button class="vote ${voted.has(p.id) ? "on" : ""}" data-v="${p.id}" title="나도 겪었어요">▲<span>${p.votes}</span><small>나도요</small></button>
        <div style="min-width:0">
          <div style="display:flex;gap:6px;align-items:center;margin-bottom:4px">${statusChip(p.status)}${typeChip(p.type)}</div>
          <div class="t">${esc(p.title)}</div>
          ${p.body ? `<div class="b">${esc(p.body)}</div>` : ""}
          ${p.shots.length ? `<div class="thumbs" style="margin-bottom:8px">${thumbsHTML(p.shots, 72)}</div>` : ""}
          <div class="meta"><span>${p.author} · ${p.date}</span><span>· ${p.page}</span>${p.comments ? `<span>· 💬 ${p.comments}</span>` : ""}</div>
          ${p.reply ? `<div class="reply ${p.status === "done" ? "" : "doing"}"><b>FITME</b> · ${esc(p.reply)}</div>` : ""}
          <div class="admin-tools admin-only">
            <select class="select" style="width:auto;padding:3px 8px" data-s="${p.id}">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === p.status ? "selected" : ""}>${v.label}</option>`).join("")}</select>
            <input class="input" style="flex:1;min-width:180px;padding:3px 10px" placeholder="모두에게 보일 답변" value="${esc(p.reply || "")}">
            <button class="btn sm">저장</button>
            <button class="btn ghost sm" title="같은 내용의 다른 글에 합치기">중복으로 합치기</button>
          </div>
        </div>
      </article>`).join("");
  }

  function renderSide() {
    const c = (s) => POSTS.filter((p) => p.status === s).length;
    document.getElementById("road").innerHTML = ["new", "doing", "done"].map((s) =>
      `<a href="#" data-s="${s}">${statusChip(s)}<span class="n">${c(s)}</span></a>`).join("");
    document.getElementById("log").innerHTML = POSTS.filter((p) => p.status === "done").map((p) =>
      `<div><div class="d">${p.doneAt} 해결</div>${esc(p.title)}</div>`).join("");
  }

  document.getElementById("feed").addEventListener("click", (e) => {
    const v = e.target.closest("[data-v]"); if (!v) return;
    const p = POSTS.find((x) => x.id === +v.dataset.v);
    if (voted.has(p.id)) { voted.delete(p.id); p.votes--; } else { voted.add(p.id); p.votes++; toast("공감했어요. 해결되면 알려 드릴게요"); }
    renderFeed();
  });
  document.getElementById("feed").addEventListener("change", (e) => {
    const s = e.target.closest("select[data-s]"); if (!s) return;
    const p = POSTS.find((x) => x.id === +s.dataset.s); p.status = s.value;
    toast(`#${p.id} → ${STATUS[p.status].label} · 공감한 ${p.votes}명에게 알림`); renderFeed(); renderSide();
  });
  document.getElementById("stSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll("#stSeg button").forEach((x) => x.classList.toggle("on", x === b)); stFilter = b.dataset.s; renderFeed();
  });
  document.getElementById("sort").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll("#sort button").forEach((x) => x.classList.toggle("on", x === b)); order = b.dataset.o; renderFeed();
  });
  // writing: the box opens on focus and shows look-alike posts while typing (fewer duplicates)
  const compose = document.getElementById("compose");
  const title = document.getElementById("title");
  title.addEventListener("focus", () => compose.classList.remove("collapsed"));
  title.addEventListener("input", () => {
    const words = title.value.trim().split(/\s+/).filter((w) => w.length >= 2);
    const hits = words.length ? POSTS.filter((p) => words.some((w) => p.title.includes(w))).slice(0, 3) : [];
    document.getElementById("similar").innerHTML = hits.length
      ? `<div class="muted" style="font-size:12.5px;margin-bottom:6px">혹시 이 글과 같은 내용인가요? 같으면 공감만 눌러 주세요.</div>` +
        hits.map((p) => `<div style="display:flex;gap:8px;align-items:center;font-size:13px;padding:4px 0">${statusChip(p.status)} ${esc(p.title)} <span class="muted">▲${p.votes}</span></div>`).join("")
      : "";
  });
  document.getElementById("cancel").addEventListener("click", () => { compose.classList.add("collapsed"); title.value = ""; picker.clear(); });
  document.getElementById("send").addEventListener("click", () => { compose.classList.add("collapsed"); title.value = ""; picker.clear(); toast("올렸어요"); });
  const picker = imagePicker({ drop: document.getElementById("drop"), input: document.getElementById("file"), list: document.getElementById("picked"), scope: compose });
  modeSwitch(() => { renderFeed(); });
  renderFeed(); renderSide();
</script>
</body>
</html>
