<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>C 게시판 · 피드백 게시판 시안</title>
<link rel="stylesheet" href="shared.css" />
<style>
  /* C — 게시판: GitHub 이슈·사내 게시판처럼 표 하나로 보고, 누르면 글 화면으로 들어가요. */
  .st-new { color: var(--st-new); } .st-doing { color: var(--st-doing); } .st-done { color: var(--st-done); } .st-hold { color: var(--st-hold); }
  .page { height: 100%; overflow-y: auto; background: #fff; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 32px 64px; }
  .ph { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
  .ph h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
  .ph p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
  .utabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); }
  .utabs button { height: 40px; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 6px; }
  .utabs button.on { color: var(--ink); font-weight: 600; border-color: var(--ink); }
  .utabs .n { font-size: 12px; color: var(--faint); font-weight: 500; }
  .filters { display: flex; gap: 8px; align-items: center; padding: 14px 0; }
  .sel { height: 34px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 10px; background: #fff; font-size: 13px; }
  .search { margin-left: auto; display: flex; align-items: center; gap: 6px; height: 34px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 10px; color: var(--muted); width: 240px; }
  .search input { border: 0; outline: 0; flex: 1; font-size: 13px; background: none; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 10px 12px; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 13px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: var(--bg-2); }
  td.title { white-space: normal; width: 100%; }
  td.title .c { color: var(--muted); font-size: 12.5px; margin-left: 6px; display: inline-flex; align-items: center; gap: 2px; vertical-align: -1px; }
  td.title .c svg.lucide { width: 13px; height: 13px; }
  .st { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  .st svg.lucide { width: 15px; height: 15px; }
  .muted { color: var(--muted); }
  .no { color: var(--faint); font-size: 12.5px; }
  .pager { display: flex; justify-content: center; gap: 4px; margin-top: 20px; }
  .pager button { width: 30px; height: 30px; border-radius: 6px; font-size: 13px; color: var(--muted); }
  .pager button.on { background: var(--ink); color: #fff; }

  .back { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 13.5px; margin-bottom: 20px; }
  .back:hover { color: var(--ink); }
  .post { max-width: 760px; }
  .post .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; color: var(--muted); font-size: 13px; }
  .post h1 { margin: 10px 0 12px; font-size: 26px; line-height: 1.35; font-weight: 700; letter-spacing: -0.025em; }
  .post .body { font-size: 15px; line-height: 1.7; color: var(--ink-2); white-space: pre-wrap; margin: 24px 0; }
  .post .shots { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px; }
  .post .shots img { max-height: 220px; width: auto; border: 1px solid var(--line); border-radius: 8px; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .bar .lbl { font-size: 13px; color: var(--muted); }
  .bar select { height: 34px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 10px; background: #fff; font-size: 13.5px; }
  h3.ch { font-size: 15px; margin: 28px 0 8px; }
  .cmt { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .cmt .who { font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .cmt .who b { font-weight: 650; }
  .cmt .who .tag { font-size: 11.5px; color: #fff; background: var(--ink); border-radius: 4px; padding: 0 5px; }
  .cmt p { margin: 6px 0 0; font-size: 14.5px; line-height: 1.65; }
  .evt { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .reply { margin-top: 20px; border: 1px solid var(--line-2); border-radius: 10px; }
  .reply textarea { width: 100%; border: 0; outline: 0; resize: vertical; min-height: 96px; padding: 12px 14px; font-size: 14px; display: block; background: none; }
  .reply .tb { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--line); }
  .link { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 13px; height: 30px; padding: 0 6px; border-radius: 6px; }
  .link:hover { background: var(--bg-2); color: var(--ink); }
  .btn { height: 34px; padding: 0 16px; border-radius: 8px; font-size: 13.5px; font-weight: 600; background: var(--ink); color: #fff; }
  .btn.line { background: #fff; color: var(--ink); border: 1px solid var(--line-2); font-weight: 500; }
  .sp { flex: 1; }

  /* ── user widget ── */
  .trigger { position: absolute; right: 24px; bottom: 24px; height: 40px; padding: 0 16px; border-radius: 8px; background: #fff; border: 1px solid var(--line-2); box-shadow: 0 2px 8px rgba(0,0,0,.06); font-size: 13.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .trigger .dot { width: 7px; height: 7px; border-radius: 50%; background: #ff5a36; }
  .dim { position: absolute; inset: 0; background: rgba(17,19,24,.36); display: grid; place-items: center; }
  .modal { width: 520px; max-height: calc(100% - 64px); background: #fff; border-radius: 14px; box-shadow: 0 24px 64px rgba(0,0,0,.22); display: flex; flex-direction: column; overflow: hidden; }
  .mh { display: flex; align-items: center; gap: 20px; padding: 0 20px; border-bottom: 1px solid var(--line); }
  .mh button.t { height: 52px; font-size: 15px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .mh button.t.on { color: var(--ink); font-weight: 650; border-color: var(--ink); }
  .mh .x { margin-left: auto; color: var(--muted); }
  .mb { padding: 20px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
  .fld label.l { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .radios { display: flex; gap: 18px; font-size: 14px; }
  .radios label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .radios input { accent-color: var(--ink); width: 16px; height: 16px; margin: 0; }
  .fld textarea { width: 100%; border: 1px solid var(--line-2); border-radius: 8px; outline: 0; resize: vertical; min-height: 120px; padding: 10px 12px; font-size: 14px; }
  .fld textarea:focus { border-color: var(--ink); }
  .files { display: flex; gap: 8px; }
  .thumb { position: relative; width: 96px; height: 64px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb button { position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; display: grid; place-items: center; }
  .thumb button svg.lucide { width: 11px; height: 11px; stroke-width: 2.5; }
  .add { width: 64px; height: 64px; border: 1px dashed var(--line-2); border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
  .help { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
  .mf { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); }
  .mine td { padding: 12px 8px; }
  .mine th { padding: 8px; }
  .unread { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #ff5a36; margin-left: 6px; vertical-align: 2px; }
  .mdet { background: var(--bg-2); border-radius: 8px; padding: 12px 14px; font-size: 13.5px; white-space: normal; }
  .mdet b { display: block; font-size: 12.5px; margin-bottom: 2px; }
</style>
</head>
<body>
<div class="stage" id="root"></div>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="shared.js"></script>
<script>
const S = { tab: "open", kind: "all", q: "", post: null, open: true, mtab: "write", wkind: "bug", capture: true, mineOpen: 11 };
const root = document.getElementById("root");
const st = (s) => `<span class="st">${stIcon(s)}${STATUS[s].label}</span>`;

function visible() {
  const want = { open: ["new", "doing"], done: ["done"], hold: ["hold"], all: STATUS_ORDER }[S.tab];
  return POSTS.filter((p) => want.includes(p.status) && (S.kind === "all" || p.kind === S.kind) && (!S.q || (p.title + p.body).includes(S.q)));
}

function list() {
  const tab = (k, l, n) => `<button class="${S.tab === k ? "on" : ""}" data-tab="${k}">${l}<span class="n num">${n}</span></button>`;
  const rows = visible();
  return `<div class="ph"><div><h1>피드백</h1><p>테스터가 남긴 버그와 제안이에요.</p></div></div>
    <div class="utabs">${tab("open", "진행 중", count("new") + count("doing"))}${tab("done", "해결됨", count("done"))}${tab("hold", "보류", count("hold"))}${tab("all", "전체", count("all"))}</div>
    <div class="filters">
      <select class="sel" id="kind"><option value="all">모든 종류</option>${Object.entries(KIND).map(([k, v]) => `<option value="${k}" ${S.kind === k ? "selected" : ""}>${v.label}</option>`).join("")}</select>
      <label class="search">${icon("search")}<input id="q" placeholder="제목·내용 검색" value="${esc(S.q)}" /></label>
    </div>
    <table><thead><tr><th>번호</th><th>상태</th><th>제목</th><th>종류</th><th>화면</th><th>남긴 사람</th><th>날짜</th></tr></thead>
    <tbody>${rows.map((p) => `<tr data-post="${p.id}"><td class="no num">${p.id}</td><td>${st(p.status)}</td>
      <td class="title">${esc(p.title)}${replies(p) ? `<span class="c num">${icon("message-circle")}${replies(p)}</span>` : ""}${p.images.length ? `<span class="c">${icon("image")}</span>` : ""}</td>
      <td class="muted">${KIND[p.kind].label}</td><td class="muted">${esc(p.page)}</td><td>${esc(p.author)}</td><td class="muted num">${p.at.split(" ")[0]}</td></tr>`).join("")}</tbody></table>
    ${rows.length ? "" : `<p class="muted" style="padding:24px 0;text-align:center">해당하는 피드백이 없어요.</p>`}
    <div class="pager"><button class="on num">1</button></div>`;
}

function post(p) {
  return `<button class="back" data-back>${icon("chevron-left")}목록</button>
    <article class="post">
      <div class="meta">${st(p.status)}<span>${KIND[p.kind].label}</span><span class="num">#${p.id}</span></div>
      <h1>${esc(p.title)}</h1>
      <div class="meta"><span>${esc(p.author)}</span><span class="num">${p.at}</span><span>${esc(p.page)}</span>${p.device ? `<span>${esc(p.device)}</span>` : ""}</div>
      <p class="body">${esc(p.body)}</p>
      ${p.images.length ? `<div class="shots">${p.images.map((s) => `<img src="${s}" alt="첨부 사진" />`).join("")}</div>` : ""}
      <div class="bar"><span class="lbl">상태</span>
        <select id="status">${STATUS_ORDER.map((s) => `<option value="${s}" ${p.status === s ? "selected" : ""}>${STATUS[s].label}</option>`).join("")}</select>
        <span class="sp"></span><span class="lbl">상태를 바꾸면 남긴 사람에게 알려요</span></div>
      <h3 class="ch">답변 <span class="muted num" style="font-weight:500">${replies(p)}</span></h3>
      ${p.log.map((l) => l.status
        ? `<div class="evt">${stIcon(l.status)}<span>${STATUS[l.status].label}(으)로 바뀌었어요 · <span class="num">${l.at}</span></span></div>`
        : `<div class="cmt"><div class="who"><b>FITME</b><span class="tag">관리자</span><span class="muted num">${l.at}</span></div><p>${esc(l.body)}</p></div>`).join("")}
      <div class="reply"><textarea placeholder="답변을 입력하세요"></textarea>
        <div class="tb"><button class="link">${icon("paperclip")}사진 첨부</button>
          <select class="sel" id="quick" style="height:30px"><option value="">빠른 답변</option>${QUICK.map((q) => `<option>${esc(q)}</option>`).join("")}</select>
          <span class="sp"></span><button class="btn">답변 등록</button></div></div>
    </article>`;
}

function admin() {
  const p = S.post && POSTS.find((x) => x.id === S.post);
  return `<div class="page"><div class="wrap">${p ? post(p) : list()}</div></div>`;
}

function user() {
  const write = `<div class="mb">
      <div class="fld"><label class="l">종류</label><div class="radios">${Object.entries(KIND).map(([k, v]) => `<label><input type="radio" name="k" value="${k}" ${S.wkind === k ? "checked" : ""} />${v.label}</label>`).join("")}</div></div>
      <div class="fld"><label class="l" for="body">내용</label><textarea id="body" placeholder="${S.wkind === "bug" ? "무엇을 했을 때 어떻게 됐나요?" : "어떻게 바뀌면 좋을까요?"}"></textarea></div>
      <div class="fld"><label class="l">사진 <span class="muted" style="font-weight:400">선택 · 최대 5장</span></label>
        <div class="files">${S.capture ? `<div class="thumb"><img src="${IMG.onboarding}" alt="지금 화면" /><button data-uncap title="빼기">${icon("x")}</button></div>` : ""}<button class="add" title="사진 추가">${icon("plus")}</button></div>
        <p class="help">${S.capture ? "지금 보던 화면을 자동으로 넣었어요. 원하지 않으면 빼 주세요." : "스크린샷은 붙여 넣기(⌘V)로도 넣을 수 있어요."}</p></div>
    </div>
    <div class="mf"><button class="btn line" data-close>취소</button><button class="btn">보내기</button></div>`;
  const mine = `<div class="mb"><table class="mine"><thead><tr><th>상태</th><th>제목</th><th>날짜</th></tr></thead><tbody>
      ${MINE.map((m) => `<tr data-mine="${m.id}"><td>${st(m.status)}</td><td class="title">${esc(m.title)}${m.unread ? `<span class="unread"></span>` : ""}</td><td class="muted num">${m.at.split(" ")[0]}</td></tr>
        ${S.mineOpen === m.id ? `<tr><td colspan="3" style="border-bottom:1px solid var(--line)">${m.log.filter((l) => !l.status).map((l) => `<div class="mdet"><b>FITME 답변 · <span class="num">${l.at}</span></b>${esc(l.body)}</div>`).join("") || `<span class="muted">아직 답변이 없어요.</span>`}</td></tr>` : ""}`).join("")}
    </tbody></table></div>`;
  return `${fakeApp()}
    <button class="trigger" data-fab>${icon("message-square")}피드백 보내기${MINE.some((m) => m.unread) ? `<span class="dot"></span>` : ""}</button>
    ${S.open ? `<div class="dim" data-dim><div class="modal" role="dialog" aria-label="피드백">
      <div class="mh"><button class="t ${S.mtab === "write" ? "on" : ""}" data-mtab="write">피드백 보내기</button><button class="t ${S.mtab === "mine" ? "on" : ""}" data-mtab="mine">보낸 피드백</button><button class="x" data-close title="닫기">${icon("x")}</button></div>
      ${S.mtab === "write" ? write : mine}</div></div>` : ""}`;
}

window.render = (v) => { S.view = v ?? S.view; root.innerHTML = S.view === "user" ? user() : admin(); paint(); };

root.addEventListener("click", (e) => {
  if (e.target.dataset && "dim" in e.target.dataset) { S.open = false; return render(); }
  const tr = e.target.closest("tr[data-post]"); if (tr) { S.post = +tr.dataset.post; return render(); }
  const mr = e.target.closest("tr[data-mine]"); if (mr) { S.mineOpen = S.mineOpen === +mr.dataset.mine ? null : +mr.dataset.mine; return render(); }
  const t = e.target.closest("button"); if (!t) return; const d = t.dataset;
  if (d.tab) S.tab = d.tab;
  else if ("back" in d) S.post = null;
  else if (d.mtab) S.mtab = d.mtab;
  else if ("uncap" in d) S.capture = false;
  else if ("close" in d) S.open = false;
  else if ("fab" in d) S.open = true;
  else return;
  render();
});
root.addEventListener("change", (e) => {
  if (e.target.id === "kind") S.kind = e.target.value;
  else if (e.target.id === "status") POSTS.find((p) => p.id === S.post).status = e.target.value;
  else if (e.target.id === "quick") { root.querySelector(".reply textarea").value = e.target.value; e.target.value = ""; return; }
  else if (e.target.name === "k") S.wkind = e.target.value;
  else return;
  render();
});
root.addEventListener("input", (e) => { if (e.target.id === "q") { S.q = e.target.value; render(); const q = document.getElementById("q"); q.focus(); q.setSelectionRange(S.q.length, S.q.length); } });
mount("c-board.html");
</script>
</body>
</html>
