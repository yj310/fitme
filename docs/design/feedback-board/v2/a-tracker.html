<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A 이슈 트래커 · 피드백 게시판 시안</title>
<link rel="stylesheet" href="shared.css" />
<style>
  /* A — 이슈 트래커: Linear·Height 같은 업무 도구. 목록 한 줄, 상태는 아이콘 하나, 속성은 오른쪽 칸. */
  .st-new { color: var(--st-new); } .st-doing { color: var(--st-doing); } .st-done { color: var(--st-done); } .st-hold { color: var(--st-hold); }

  .board { display: grid; grid-template-columns: 440px minmax(0, 1fr) 232px; height: 100%; }
  .list { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .list-head { padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid var(--line); }
  .list-head .row { display: flex; align-items: center; justify-content: space-between; }
  .list-head h1 { margin: 0; font-size: 16px; font-weight: 650; }
  .search { display: flex; align-items: center; gap: 6px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  .search input { border: 0; outline: 0; flex: 1; font-size: 13px; background: none; }
  .tabs { display: flex; gap: 2px; }
  .tabs button { padding: 4px 10px; border-radius: 6px; font-size: 13px; color: var(--muted); }
  .tabs button:hover { background: var(--hover); }
  .tabs button.on { background: var(--hover); color: var(--ink); font-weight: 600; }
  .tabs .n { margin-left: 4px; color: var(--faint); font-size: 12px; }
  .scroll { overflow-y: auto; flex: 1; }
  .group { display: flex; align-items: center; gap: 8px; padding: 14px 16px 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  .group .n { color: var(--faint); font-weight: 500; }
  .item { width: 100%; display: grid; grid-template-columns: 16px 34px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 0 16px; height: 38px; text-align: left; font-size: 13.5px; }
  .item:hover { background: var(--hover); }
  .item.on { background: #eef0f3; }
  .item .id { color: var(--faint); font-size: 12px; }
  .item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .meta { display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: 12px; }
  .item .meta span { display: inline-flex; align-items: center; gap: 3px; }
  .item .meta svg.lucide { width: 13px; height: 13px; }

  .detail { overflow-y: auto; padding: 28px 40px 40px; }
  .detail .crumb { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .detail h2 { margin: 8px 0 14px; font-size: 22px; line-height: 1.35; font-weight: 700; letter-spacing: -0.02em; }
  .detail .body { font-size: 14.5px; color: var(--ink-2); white-space: pre-wrap; margin: 0 0 18px; max-width: 680px; }
  .shots { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }
  .shots img { height: 120px; width: auto; border: 1px solid var(--line); border-radius: 6px; }
  .act-h { font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 0 0 12px; padding-top: 18px; border-top: 1px solid var(--line); }
  .act { display: flex; flex-direction: column; gap: 14px; max-width: 680px; }
  .ev { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12.5px; }
  .ev svg.lucide { width: 14px; height: 14px; }
  .cm { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .cm .who { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
  .cm .who b { color: var(--ink); font-weight: 600; margin-right: 6px; }
  .cm p { margin: 0; font-size: 14px; }
  .composer { margin-top: 16px; border: 1px solid var(--line-2); border-radius: 8px; max-width: 680px; }
  .composer textarea { width: 100%; border: 0; outline: 0; resize: none; padding: 10px 12px; min-height: 64px; font-size: 14px; background: none; display: block; }
  .composer .tb { display: flex; align-items: center; gap: 4px; padding: 6px 8px; }
  .ibtn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: 28px; min-width: 28px; padding: 0 6px; border-radius: 6px; color: var(--muted); font-size: 12.5px; }
  .ibtn:hover { background: var(--hover); color: var(--ink); }
  .primary { background: var(--primary); color: var(--primary-ink); border-radius: 6px; height: 28px; padding: 0 12px; font-size: 13px; font-weight: 600; }
  .sp { flex: 1; }
  .menu { position: relative; }
  .menu .pop { position: absolute; bottom: 32px; left: 0; z-index: 5; width: 300px; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.08); padding: 4px; }
  .menu .pop button { display: block; width: 100%; text-align: left; padding: 7px 8px; border-radius: 6px; font-size: 13px; }
  .menu .pop button:hover { background: var(--hover); }

  .props { border-left: 1px solid var(--line); padding: 28px 16px; display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
  .prop { display: grid; grid-template-columns: 64px 1fr; align-items: center; min-height: 32px; }
  .prop dt { color: var(--muted); }
  .prop dd { margin: 0; display: flex; align-items: center; gap: 6px; }
  .stsel { display: inline-flex; align-items: center; gap: 6px; padding: 3px 6px; margin-left: -6px; border-radius: 6px; }
  .stsel:hover { background: var(--hover); }
  .props .pop { position: absolute; z-index: 5; width: 160px; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.08); padding: 4px; }
  .props .pop button { display: flex; width: 100%; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; }
  .props .pop button:hover { background: var(--hover); }
  .props .pop kbd { margin-left: auto; color: var(--faint); font: 11px ui-monospace, Menlo, monospace; }
  .props hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }

  /* ── user widget ── */
  .fab { position: absolute; right: 24px; bottom: 24px; display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 19px; background: var(--primary); color: #fff; font-size: 13.5px; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .fab .dot { width: 7px; height: 7px; border-radius: 50%; background: #ff5a36; }
  .panel { position: absolute; right: 24px; bottom: 74px; width: 360px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 48px rgba(0,0,0,.14); display: flex; flex-direction: column; max-height: calc(100% - 110px); overflow: hidden; }
  .ptabs { display: flex; gap: 18px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .ptabs button { height: 42px; font-size: 13.5px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .ptabs button.on { color: var(--ink); font-weight: 600; border-color: var(--ink); }
  .ptabs .x { margin-left: auto; color: var(--muted); }
  .pbody { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
  .segc { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bg-2); border-radius: 8px; padding: 3px; }
  .segc button { height: 30px; border-radius: 6px; font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
  .segc button.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .segc svg.lucide { width: 14px; height: 14px; }
  .field { border: 1px solid var(--line-2); border-radius: 8px; }
  .field:focus-within { border-color: var(--ink); }
  .field textarea { width: 100%; border: 0; outline: 0; resize: none; padding: 10px 12px; min-height: 104px; font-size: 14px; display: block; background: none; }
  .att { display: flex; gap: 8px; padding: 0 10px 10px; }
  .thumb { position: relative; width: 64px; height: 48px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb button { position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; display: grid; place-items: center; }
  .thumb button svg.lucide { width: 10px; height: 10px; stroke-width: 2.5; }
  .add { width: 48px; height: 48px; border: 1px dashed var(--line-2); border-radius: 6px; display: grid; place-items: center; color: var(--muted); }
  .hint { font-size: 12px; color: var(--muted); margin: 0; }
  .pfoot { display: flex; align-items: center; justify-content: space-between; }
  .pfoot .primary { height: 34px; padding: 0 16px; }
  .mine { display: flex; flex-direction: column; }
  .mrow { display: grid; grid-template-columns: 16px 1fr auto; gap: 10px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
  .mrow .t { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mrow .d { font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 6px; }
  .mrow .new { width: 6px; height: 6px; border-radius: 50%; background: #ff5a36; }
  .mdetail { padding: 4px 0 14px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
  .mdetail .stline { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
  .mdetail .reply { background: var(--bg-2); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; }
  .mdetail .reply b { display: block; font-size: 12px; margin-bottom: 2px; }
</style>
</head>
<body>
<div class="stage" id="root"></div>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="shared.js"></script>
<script>
const S = { tab: "open", sel: 12, q: "", stOpen: false, quick: false, open: true, wtab: "write", kind: "bug", mineOpen: 11, capture: true };
const root = document.getElementById("root");

function visible() {
  const want = { open: ["new", "doing"], done: ["done"], hold: ["hold"], all: STATUS_ORDER }[S.tab];
  return POSTS.filter((p) => want.includes(p.status) && (!S.q || (p.title + p.body + p.author).includes(S.q)));
}

function admin() {
  const vis = visible();
  if (!vis.find((p) => p.id === S.sel) && vis[0]) S.sel = vis[0].id;
  const p = POSTS.find((x) => x.id === S.sel);
  const groups = STATUS_ORDER.map((s) => [s, vis.filter((x) => x.status === s)]).filter(([, l]) => l.length);
  const tab = (k, l, n) => `<button class="${S.tab === k ? "on" : ""}" data-tab="${k}">${l}<span class="n num">${n}</span></button>`;
  return `<div class="board">
    <section class="list">
      <div class="list-head">
        <div class="row"><h1>피드백</h1><button class="ibtn" title="새로고침">${icon("rotate-cw")}</button></div>
        <label class="search">${icon("search")}<input id="q" placeholder="검색" value="${esc(S.q)}" /></label>
        <div class="tabs">${tab("open", "진행 중", count("new") + count("doing"))}${tab("done", "해결됨", count("done"))}${tab("hold", "보류", count("hold"))}${tab("all", "전체", count("all"))}</div>
      </div>
      <div class="scroll">
        ${groups.map(([s, l]) => `<div class="group">${stIcon(s)}${STATUS[s].label}<span class="n num">${l.length}</span></div>
          ${l.map((x) => `<button class="item ${x.id === S.sel ? "on" : ""}" data-sel="${x.id}">
            ${stIcon(x.status)}<span class="id num">#${x.id}</span><span class="t">${esc(x.title)}</span>
            <span class="meta">${x.images.length ? `<span>${icon("image")}</span>` : ""}${replies(x) ? `<span class="num">${icon("message-circle")}${replies(x)}</span>` : ""}<span class="num">${x.at.split(" ")[0]}</span></span>
          </button>`).join("")}`).join("") || `<p style="padding:16px;color:var(--muted)">없어요.</p>`}
      </div>
    </section>
    ${p ? detail(p) : "<div></div><div></div>"}
  </div>`;
}

function detail(p) {
  return `<article class="detail">
      <div class="crumb">${icon(KIND[p.kind].icon)}${KIND[p.kind].label}<span>·</span><span class="num">#${p.id}</span></div>
      <h2>${esc(p.title)}</h2>
      <p class="body">${esc(p.body)}</p>
      ${p.images.length ? `<div class="shots">${p.images.map((s) => `<img src="${s}" alt="첨부 사진" />`).join("")}</div>` : ""}
      <h3 class="act-h">활동</h3>
      <div class="act">
        <div class="ev">${icon("plus-circle")}<span><b style="color:var(--ink);font-weight:600">${esc(p.author)}</b>님이 남겼어요 · <span class="num">${p.at}</span></span></div>
        ${p.log.map((l) => l.status
          ? `<div class="ev">${stIcon(l.status)}<span>상태를 <b style="color:var(--ink);font-weight:600">${STATUS[l.status].label}</b>(으)로 바꿨어요 · <span class="num">${l.at}</span></span></div>`
          : `<div class="cm"><div class="who"><b>FITME</b><span class="num">${l.at}</span></div><p>${esc(l.body)}</p></div>`).join("")}
      </div>
      <div class="composer">
        <textarea placeholder="답변 남기기"></textarea>
        <div class="tb">
          <button class="ibtn" title="사진 첨부">${icon("paperclip")}</button>
          <span class="menu"><button class="ibtn" data-quick>${icon("zap")}빠른 답변</button>
            ${S.quick ? `<div class="pop">${QUICK.map((q) => `<button data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>` : ""}</span>
          <span class="sp"></span>
          <button class="primary">보내기</button>
        </div>
      </div>
    </article>
    <aside class="props">
      <dl style="margin:0">
        <div class="prop" style="position:relative"><dt>상태</dt><dd><button class="stsel" data-st>${stIcon(p.status)}${STATUS[p.status].label}</button>
          ${S.stOpen ? `<div class="pop" style="top:30px;left:58px">${STATUS_ORDER.map((s, i) => `<button data-set="${s}">${stIcon(s)}${STATUS[s].label}<kbd>${i + 1}</kbd></button>`).join("")}</div>` : ""}</dd></div>
        <div class="prop"><dt>종류</dt><dd>${icon(KIND[p.kind].icon)}${KIND[p.kind].label}</dd></div>
        <hr />
        <div class="prop"><dt>남긴 사람</dt><dd>${esc(p.author)}</dd></div>
        <div class="prop"><dt>날짜</dt><dd class="num">${p.at}</dd></div>
        <div class="prop"><dt>화면</dt><dd>${esc(p.page)}</dd></div>
        <div class="prop"><dt>기기</dt><dd>${esc(p.device ?? "—")}</dd></div>
      </dl>
    </aside>`;
}

function user() {
  const tab = (k, l) => `<button class="${S.wtab === k ? "on" : ""}" data-wtab="${k}">${l}</button>`;
  const write = `<div class="pbody">
      <div class="segc" role="radiogroup">${Object.entries(KIND).map(([k, v]) => `<button class="${S.kind === k ? "on" : ""}" data-kind="${k}">${icon(v.icon)}${v.label}</button>`).join("")}</div>
      <div class="field">
        <textarea placeholder="${S.kind === "bug" ? "무엇을 했을 때 어떻게 됐나요?" : S.kind === "idea" ? "어떻게 바뀌면 좋을까요?" : "자유롭게 적어 주세요"}"></textarea>
        <div class="att">
          ${S.capture ? `<div class="thumb"><img src="${IMG.onboarding}" alt="지금 화면" /><button data-uncap title="빼기">${icon("x")}</button></div>` : ""}
          <button class="add" title="사진 추가">${icon("image-plus")}</button>
        </div>
      </div>
      <p class="hint">${S.capture ? "지금 화면과 기기 정보가 함께 보내져요." : "기기 정보가 함께 보내져요."}</p>
      <div class="pfoot"><span class="hint">대화 화면</span><button class="primary">보내기</button></div>
    </div>`;
  const mine = `<div class="pbody"><div class="mine">${MINE.map((m) => `
      <button class="mrow" data-mine="${m.id}">${stIcon(m.status)}<span class="t">${esc(m.title)}</span><span class="d num">${m.unread ? `<span class="new"></span>` : ""}${m.at.split(" ")[0]}</span></button>
      ${S.mineOpen === m.id ? `<div class="mdetail">
        <div class="stline">${stIcon(m.status)}${STATUS[m.status].label}</div>
        ${m.log.filter((l) => !l.status).map((l) => `<div class="reply"><b>FITME 답변</b>${esc(l.body)}</div>`).join("")}
        <button class="ibtn" style="align-self:flex-start;margin-left:-6px">${icon("corner-down-right")}덧붙이기</button>
      </div>` : ""}`).join("")}</div></div>`;
  return `${fakeApp()}
    ${S.open ? `<div class="panel" role="dialog" aria-label="피드백">
      <div class="ptabs">${tab("write", "보내기")}${tab("mine", "내 피드백")}<button class="x" data-close title="닫기">${icon("x")}</button></div>
      ${S.wtab === "write" ? write : mine}
    </div>` : ""}
    <button class="fab" data-fab>${icon("message-square")}피드백${MINE.some((m) => m.unread) ? `<span class="dot"></span>` : ""}</button>`;
}

window.render = (v) => {
  S.view = v ?? S.view;
  root.innerHTML = S.view === "user" ? user() : admin();
  paint();
};

root.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  const d = t.dataset;
  if (d.tab) S.tab = d.tab;
  else if (d.sel) { S.sel = +d.sel; S.stOpen = S.quick = false; }
  else if ("st" in d) S.stOpen = !S.stOpen;
  else if (d.set) { POSTS.find((p) => p.id === S.sel).status = d.set; S.stOpen = false; }
  else if ("quick" in d) S.quick = !S.quick;
  else if (d.q) { S.quick = false; render(); root.querySelector(".composer textarea").value = d.q; return; }
  else if (d.wtab) S.wtab = d.wtab;
  else if (d.kind) S.kind = d.kind;
  else if ("uncap" in d) S.capture = false;
  else if (d.mine) S.mineOpen = S.mineOpen === +d.mine ? null : +d.mine;
  else if ("close" in d) S.open = false;
  else if ("fab" in d) S.open = !S.open;
  else return;
  render();
});
root.addEventListener("input", (e) => { if (e.target.id === "q") { S.q = e.target.value; render(); const q = document.getElementById("q"); q.focus(); q.setSelectionRange(S.q.length, S.q.length); } });
document.addEventListener("keydown", (e) => {
  if (S.view !== "admin" || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const vis = visible(); const i = vis.findIndex((p) => p.id === S.sel);
  if (e.key === "j" && vis[i + 1]) S.sel = vis[i + 1].id;
  else if (e.key === "k" && vis[i - 1]) S.sel = vis[i - 1].id;
  else if (/^[1-4]$/.test(e.key)) POSTS.find((p) => p.id === S.sel).status = STATUS_ORDER[+e.key - 1];
  else return;
  render();
});
mount("a-tracker.html");
</script>
</body>
</html>
