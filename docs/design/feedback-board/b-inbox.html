<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 B · 목록 + 상세 패널</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="shared.js"></script>
<style>
  .main { padding: 0; display: grid; grid-template-columns: minmax(340px, 440px) minmax(0, 1fr); height: calc(100vh - 38px); }
  .list { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--surface); }
  .list-h { padding: 16px 16px 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
  .tabs { display: flex; gap: 2px; overflow-x: auto; }
  .tabs button { border: 0; background: transparent; border-radius: 8px; padding: 5px 10px; font-size: 13px; white-space: nowrap; color: var(--muted); }
  .tabs button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .tabs .n { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; margin-left: 3px; }
  .rows { overflow-y: auto; flex: 1; }
  .row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--line); text-align: left; width: 100%; background: transparent; border-left: 3px solid transparent; border-top: 0; border-right: 0; }
  .row:hover { background: var(--app-bg); }
  .row.on { background: var(--accent-soft); border-left-color: var(--accent); }
  .row .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; }
  .row .t { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .m { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; margin-top: 2px; }
  .row .r { font-size: 12px; color: var(--muted); text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .row.unread .t::after { content: " ●"; color: var(--accent); font-size: 9px; vertical-align: middle; }
  .pane { overflow-y: auto; padding: 22px 28px; display: flex; flex-direction: column; gap: 16px; }
  .pane-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .pane .title { font-size: 20px; font-weight: 700; margin: 4px 0 2px; }
  .facts { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 6px 10px; font-size: 13px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; }
  .gallery { display: flex; gap: 10px; flex-wrap: wrap; }
  .gallery .thumb { width: 180px; height: 187px; cursor: zoom-in; }
  .stbar { display: flex; gap: 6px; flex-wrap: wrap; }
  .stbar button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
  .stbar button.on.new { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); font-weight: 600; }
  .stbar button.on.doing { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }
  .stbar button.on.done { background: var(--good-soft); color: var(--good); border-color: var(--good); font-weight: 600; }
  .stbar button.on.hold { background: var(--tile); color: var(--muted); border-color: var(--line-strong); font-weight: 600; }
  .timeline { display: flex; flex-direction: column; gap: 12px; border-left: 2px solid var(--line); margin-left: 6px; padding-left: 16px; }
  .ev { position: relative; font-size: 13px; }
  .ev::before { content: ""; position: absolute; left: -22px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--line-strong); border: 2px solid var(--surface); }
  .ev.admin::before { background: var(--accent); }
  .ev .who { font-weight: 600; }
  .ev .bubble { margin-top: 4px; background: var(--app-bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .ev.admin .bubble { background: var(--accent-soft); border-color: transparent; }
  .composer { border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); }
  .composer textarea { border: 0; width: 100%; min-height: 70px; resize: vertical; padding: 10px 12px; background: transparent; outline: none; }
  .composer .bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-top: 1px solid var(--line); gap: 8px; flex-wrap: wrap; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; }
  .quick button { font-size: 12px; border: 1px dashed var(--line-strong); background: transparent; border-radius: 999px; padding: 2px 10px; color: var(--muted); }
  .kb { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
  .zoom { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; place-items: center; z-index: 60; }
  .zoom.on { display: grid; }
  .zoom .thumb { width: min(80vw, 520px); height: min(83vw, 540px); }
  @media (max-width: 900px) { .main { grid-template-columns: 1fr; height: auto; } .pane { border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div class="mock-bar">
  <b>시안 B · 목록 + 상세 패널</b><span>참고: Linear 받은편지함 · GitHub Issues · 메일함</span>
  <span class="sp"></span>
  <span class="seg"><button data-mode="user">사용자 화면</button><button data-mode="admin" class="on">관리자 화면</button></span>
  <a href="index.html">← 시안 목록</a>
</div>
<div class="app">
  <script>document.write(sidebar());</script>
  <main class="main">
    <section class="list">
      <div class="list-h">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h1 class="h1" style="font-size:19px"><span class="admin-only">피드백 관리</span><span class="user-only">내 피드백</span></h1>
          <button class="btn primary sm user-only" id="newBtn">+ 남기기</button>
        </div>
        <input class="input" placeholder="제목·내용·작성자 검색" id="q">
        <div class="tabs" id="tabs"></div>
      </div>
      <div class="rows" id="rows"></div>
    </section>
    <section class="pane" id="pane"></section>
  </main>
</div>
<div class="zoom" id="zoom"></div>

<dialog class="modal" id="write">
  <div class="modal-h">피드백 남기기 <button class="btn ghost sm" data-close>✕</button></div>
  <div class="modal-b">
    <span class="seg2"><button class="on">🐞 버그</button><button>💡 개선 제안</button><button>💬 기타</button></span>
    <input class="input" placeholder="한 줄 요약">
    <textarea class="textarea" placeholder="어떤 화면에서 무엇을 했을 때 그랬나요?"></textarea>
    <div class="drop" id="drop"><b>사진 끌어다 놓기 · 클릭</b> · 스크린샷은 <span class="kbd">⌘/Ctrl</span>+<span class="kbd">V</span></div>
    <input type="file" accept="image/*" multiple hidden id="file">
    <div class="thumbs" id="picked"></div>
  </div>
  <div class="modal-f"><button class="btn" data-close>취소</button><button class="btn primary" data-close id="send">올리기</button></div>
</dialog>

<script>
  const TABS = [["all", "전체"], ["new", "접수"], ["doing", "해결 중"], ["done", "해결됨"], ["hold", "보류"]];
  const DOT = { new: "var(--warn)", doing: "var(--accent)", done: "var(--good)", hold: "var(--line-strong)" };
  let tab = "new", sel = 12, q = "";
  const unread = new Set([12, 11]);
  const mine = (p) => p.author === "서연"; // 사용자 화면 = 서연님으로 로그인한 상태

  function visible() {
    const admin = document.body.classList.contains("admin");
    return POSTS.filter((p) => (admin || mine(p)) && (tab === "all" || p.status === tab) &&
      (!q || (p.title + p.body + p.author).includes(q)));
  }

  function renderTabs() {
    const admin = document.body.classList.contains("admin");
    const base = POSTS.filter((p) => admin || mine(p));
    document.getElementById("tabs").innerHTML = TABS.map(([k, l]) =>
      `<button data-k="${k}" class="${k === tab ? "on" : ""}">${l}<span class="n">${k === "all" ? base.length : base.filter((p) => p.status === k).length}</span></button>`).join("");
  }

  function renderRows() {
    const list = visible();
    if (!list.some((p) => p.id === sel) && list[0]) sel = list[0].id;
    document.getElementById("rows").innerHTML = list.map((p) => `
      <button class="row ${p.id === sel ? "on" : ""} ${unread.has(p.id) && document.body.classList.contains("admin") ? "unread" : ""}" data-id="${p.id}">
        <span class="dot" style="background:${DOT[p.status]}"></span>
        <span style="min-width:0"><div class="t">${esc(p.title)}</div>
          <div class="m">${TYPE[p.type].icon} ${TYPE[p.type].label} · ${p.author} · ${p.page}</div></span>
        <span class="r"><span>${p.date}</span><span>${p.shots.length ? `🖼 ${p.shots.length}` : ""} ${p.comments ? `💬 ${p.comments}` : ""}</span></span>
      </button>`).join("") || `<p class="muted" style="padding:16px">이 상태의 피드백이 없어요.</p>`;
  }

  function renderPane() {
    const p = POSTS.find((x) => x.id === sel);
    const pane = document.getElementById("pane");
    if (!p) { pane.innerHTML = `<p class="muted">왼쪽에서 피드백을 골라 주세요.</p>`; return; }
    unread.delete(p.id);
    const events = [
      { who: p.author, when: p.date, text: p.body || "(내용 없음)" },
      ...(p.status !== "new" ? [{ who: "관리자", admin: true, when: p.date, text: `상태를 <b>${STATUS[p.status === "done" ? "doing" : p.status].label}</b>(으)로 바꿨어요.`, sys: true }] : []),
      ...(p.reply ? [{ who: "관리자", admin: true, when: p.doneAt || p.date, text: esc(p.reply) }] : []),
      ...(p.status === "done" ? [{ who: "관리자", admin: true, when: p.doneAt, text: "<b>해결됨</b>으로 바꿨어요.", sys: true }] : []),
    ];
    pane.innerHTML = `
      <div class="pane-h">
        <div>
          <div style="display:flex;gap:6px;align-items:center">${typeChip(p.type)}${statusChip(p.status)}<span class="mono muted" style="font-size:12px">#${p.id}</span></div>
          <div class="title">${esc(p.title)}</div>
        </div>
        <span class="admin-only kb"><span><span class="kbd">J</span>/<span class="kbd">K</span> 이동</span><span><span class="kbd">1</span>–<span class="kbd">4</span> 상태</span></span>
      </div>
      <div class="admin-only">
        <div class="stbar" id="stbar">${Object.entries(STATUS).map(([k, v]) => `<button data-s="${k}" class="${k} ${k === p.status ? "on" : ""}"><span class="mono" style="font-size:11px;opacity:.6">${Object.keys(STATUS).indexOf(k) + 1}</span> ${v.label}</button>`).join("")}</div>
      </div>
      <dl class="facts">
        <dt>남긴 사람</dt><dd>${p.author} <span class="muted">· ${p.date}</span></dd>
        <dt>화면</dt><dd>${p.page}</dd>
        <dt>기기</dt><dd>${p.device}</dd>
        <dt class="admin-only">공감</dt><dd class="admin-only">${p.votes}명이 같은 문제를 겪었어요</dd>
      </dl>
      ${p.shots.length ? `<div class="gallery">${thumbsHTML(p.shots, 180)}</div>` : ""}
      <div class="timeline">${events.map((e) => `
        <div class="ev ${e.admin ? "admin" : ""}"><span class="who">${e.who}</span> <span class="muted">· ${e.when}</span>
          ${e.sys ? `<div class="muted">${e.text}</div>` : `<div class="bubble">${e.text}</div>`}</div>`).join("")}</div>
      <div class="composer">
        <textarea placeholder="${document.body.classList.contains("admin") ? "답변 남기기 (남긴 사람에게 알림이 가요)" : "추가로 알려 줄 내용이나 사진"}"></textarea>
        <div class="bar">
          <span class="quick admin-only"><button data-q="확인했어요. 고쳐 볼게요!">확인했어요</button><button data-q="고쳤어요. 새로고침 후 다시 확인해 주세요.">고쳤어요</button><button data-q="재현이 안 돼요. 어떤 순서로 하셨는지 알려 주실래요?">재현 안 돼요</button></span>
          <span style="display:flex;gap:6px;margin-left:auto"><button class="btn sm">🖼 사진</button><button class="btn primary sm">보내기</button></span>
        </div>
      </div>`;
    pane.querySelectorAll("[data-s]").forEach((b) => b.addEventListener("click", () => setStatus(p, b.dataset.s)));
    pane.querySelectorAll("[data-q]").forEach((b) => b.addEventListener("click", () => { pane.querySelector("textarea").value = b.dataset.q; }));
    pane.querySelectorAll(".gallery .thumb").forEach((t) => t.addEventListener("click", () => {
      const z = document.getElementById("zoom"); z.innerHTML = t.outerHTML; z.classList.add("on");
    }));
  }

  function setStatus(p, s) {
    if (p.status === s) return;
    p.status = s;
    toast(`#${p.id} → ${STATUS[s].label} · ${p.author}님께 알림`);
    renderAll();
  }
  function renderAll() { renderTabs(); renderRows(); renderPane(); }

  document.getElementById("zoom").addEventListener("click", (e) => e.currentTarget.classList.remove("on"));
  document.getElementById("tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { tab = b.dataset.k; renderAll(); } });
  document.getElementById("rows").addEventListener("click", (e) => { const b = e.target.closest(".row"); if (b) { sel = +b.dataset.id; renderAll(); } });
  document.getElementById("q").addEventListener("input", (e) => { q = e.target.value.trim(); renderAll(); });
  document.addEventListener("keydown", (e) => {
    if (!document.body.classList.contains("admin") || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    const list = visible(); const i = list.findIndex((p) => p.id === sel);
    if (e.key === "j" && list[i + 1]) { sel = list[i + 1].id; renderAll(); }
    if (e.key === "k" && list[i - 1]) { sel = list[i - 1].id; renderAll(); }
    const k = Object.keys(STATUS)[+e.key - 1];
    if (k) setStatus(POSTS.find((p) => p.id === sel), k);
  });
  document.addEventListener("click", (e) => { if (e.target.closest("[data-close]")) e.target.closest("dialog").close(); });
  const write = document.getElementById("write");
  imagePicker({ drop: document.getElementById("drop"), input: document.getElementById("file"), list: document.getElementById("picked"), scope: write });
  document.getElementById("newBtn").addEventListener("click", () => write.showModal());
  document.body.classList.add("admin");
  modeSwitch((m) => { tab = "all"; sel = m === "admin" ? 12 : 10; renderAll(); });
  renderAll();
</script>
</body>
</html>
